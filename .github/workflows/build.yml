name: Build ReadStash

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # dependency graph submission (Dependabot vulnerability alerts)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache LibreOffice engine
        uses: actions/cache@v6
        with:
          path: third_party/libreoffice
          key: libreoffice-${{ hashFiles('scripts/fetch-libreoffice.sh') }}

      - name: Fetch LibreOffice engine
        run: bash scripts/fetch-libreoffice.sh

      - name: Unit, database and security tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-test.log || {
            grep -E "^e: |What went wrong|FAILED|Exception|error:" gradle-test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            sed -n '/What went wrong/,/Try:/p' gradle-test.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            for x in app/build/test-results/testDebugUnitTest/*.xml; do
              grep -A25 "<failure" "$x" | head -40 | while IFS= read -r l; do echo "::error title=$(basename $x)::$l"; done
            done
            exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FOLIO_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/folio-release.jks"
            echo "FOLIO_KEYSTORE_PATH=$RUNNER_TEMP/folio-release.jks" >> "$GITHUB_ENV"
          elif [ -f signing/folio-release.jks.gpg ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Keystore is committed AES-256 encrypted; FOLIO_KEYSTORE_PASSWORD decrypts it.
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase "$KEYSTORE_PASSWORD" \
              --decrypt --output "$RUNNER_TEMP/folio-release.jks" signing/folio-release.jks.gpg
            echo "FOLIO_KEYSTORE_PATH=$RUNNER_TEMP/folio-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore available (need FOLIO_KEYSTORE_B64, or FOLIO_KEYSTORE_PASSWORD to decrypt signing/folio-release.jks.gpg); release builds are signed with the debug key and must not be distributed."
          fi

      - name: Build debug APK, release APK and release bundle
        env:
          FOLIO_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease 2>&1 | tee gradle-build.log || {
            grep -E "^e: |What went wrong|FAILED|Exception|error:|Missing class" gradle-build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            sed -n '/What went wrong/,/Try:/p' gradle-build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Verify signatures and permissions
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" | head -5
            "$BT/aapt2" dump permissions "$apk"
          done
          echo "::notice title=Release signing certificate::$("$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'SHA-256 digest' | head -1)"
          # Fail the build if anything outside the allowlist is requested.
          # INTERNET is declared by the app; the other four are merged in by WorkManager (background indexing).
          extra=$("$BT/aapt2" dump permissions app/build/outputs/apk/release/app-release.apk | grep "uses-permission" \
            | grep -vE "android\.permission\.(INTERNET|WAKE_LOCK|ACCESS_NETWORK_STATE|RECEIVE_BOOT_COMPLETED|FOREGROUND_SERVICE)'" \
            | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$extra" ]; then echo "$extra" | while IFS= read -r l; do echo "::error title=Unexpected permission::$l"; done; exit 1; fi

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ReadStash-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ReadStash-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/ReadStash-release.aab
          ls -la dist

      - name: Publish APKs to apk-builds branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk" && cd "$RUNNER_TEMP/apk"
          # Release APK only: with the document engine the debug APK is over GitHub's 100 MB file limit.
          cp "$GITHUB_WORKSPACE/dist/ReadStash-release.apk" .
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "APKs from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: readstash-builds
          path: dist/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14

  dependency-graph:
    runs-on: ubuntu-latest
    continue-on-error: true   # needs Settings > Code security > Dependency graph enabled
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Submit dependency graph for vulnerability alerts
        uses: gradle/actions/dependency-submission@v4
